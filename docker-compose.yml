services:
  postgres:
    image: postgres:17
    container_name: ahoum-postgres
    restart: unless-stopped
    env_file:
      - server/.env
    environment:
      POSTGRES_DB: ${DB_NAME:-ahoum}
      POSTGRES_USER: ${DB_USER:-ahoum}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ahoum_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - ahoum-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-ahoum} -d $${POSTGRES_DB:-ahoum}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ahoum-backend
    restart: unless-stopped
    env_file:
      - server/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ahoum-network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: ahoum-frontend
    restart: unless-stopped
    networks:
      - ahoum-network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: ahoum-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    networks:
      - ahoum-network

volumes:
  postgres_data:

networks:
  ahoum-network:
    driver: bridge